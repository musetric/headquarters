types:
  feat: 'new capability of the workspace or its scripts'
  fix: 'bug fix in existing behavior'
  perf: 'speed/memory optimization, behavior unchanged'
  refactor: 'internal code rewritten, behavior unchanged'
  revert: 'roll back a previously merged change'
  docs: 'documentation and readme only'
  test: 'tests added/changed, no scripts touched'
  build: 'build system & packaged artifacts'
  ci: 'CI/CD pipelines'
  chore: 'housekeeping that touches no scripts, build, or CI'

scopes:
  organization: 'who we are: the charter, the mission, the members'
  onboarding: 'setting up a new member''s machine and accounts'
  workspace: 'the repository manifest and the local layout of the organization'
  agent: 'agent guidance & config (AGENTS.md, CLAUDE.md, AI tooling)'
  practices: 'how work is done: git, pull requests, public texts, the tracker'
  environment: 'machines, devices, stands, accounts and other resources'
  research: 'what experiments found, and what not to repeat'
  github: 'repo & GitHub Actions settings (workflows, templates)'
  license: 'license and third-party notices'
